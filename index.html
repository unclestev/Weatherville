<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141c2a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weatherville">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Weatherville</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout idea: the map is the page. A forecast sheet docks on it (bottom on phones, left on wide screens); a drawer holds every setting. */
:root{
  --bg:#eef1f5; --panel:#ffffff; --panel2:#f1f4f8; --line:#d5dbe6; --ink:#17202e; --mut:#5a6880;
  --accent:#f2a83b; --onacc:#151a22; --hot:#e2573a; --cold:#3b8fe0; --wet:#2f9fd8;
  --good:#3fae6a; --warn:#d99a1e; --bad:#d6493f;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px); --sh:calc(132px + var(--sb)); color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0d131e; --panel:#141c2a; --panel2:#1b2536; --line:#2a364e; --ink:#e9eef6; --mut:#93a1ba;
  --hot:#ff8463; --cold:#6cb4ff; --wet:#5cc4f2; --good:#5fd38d; --warn:#f2c14e; --bad:#ff6b61;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:400 15px/1.4 var(--body);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{position:fixed;left:0;right:0;top:0;height:100%;height:100dvh}
#map{position:absolute;inset:0;background:var(--bg)}
.leaflet-container{font:inherit;background:var(--bg)}
.leaflet-bottom{bottom:var(--sh)}
.leaflet-control-attribution{font-size:10px;background:color-mix(in srgb,var(--panel) 80%,transparent)!important;color:var(--mut)!important}
.leaflet-control-attribution a{color:var(--mut)!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink)}

/* top bar */
#top{position:absolute;z-index:1100;top:calc(10px + var(--st));left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:flex-start}
.search{position:relative;flex:1;max-width:400px}
.search input{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:0 12px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#results{position:absolute;top:46px;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:none}
#results button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 12px}
#results button:last-child{border-bottom:0}
#results button:hover{background:var(--panel2)}
#results small{color:var(--mut)}
.ib{height:42px;min-width:42px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:500;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.ib svg{width:20px;height:20px}
.ib.on{background:var(--accent);color:var(--onacc);border-color:var(--accent)}
.spacer{flex:1}

/* radar timeline */
#timeline{position:absolute;z-index:1090;left:10px;right:10px;bottom:calc(var(--sh) + 26px);display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#timeline button{width:34px;height:34px;border-radius:50%;border:0;background:var(--accent);color:var(--onacc);display:grid;place-items:center;flex:none}
#timeline input{flex:1;accent-color:var(--accent);min-width:0}
#ftime{font:600 15px var(--display);letter-spacing:.02em;min-width:74px;text-align:right;font-variant-numeric:tabular-nums}
#fsrc{font-size:11px;color:var(--mut);white-space:nowrap}

/* legend + locate */
#fab{position:absolute;z-index:1090;right:10px;bottom:calc(var(--sh) + 84px);width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.35)}
#fab svg{width:22px;height:22px}
#fab.on{color:#2f8cff}
#fab.busy{opacity:.6}
#legend{position:absolute;z-index:1089;left:10px;bottom:calc(var(--sh) + 84px);background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:10px;line-height:1.25;padding:0;text-align:left;color:var(--mut);max-width:calc(100% - 78px)}
#legend:empty{display:none}
#legend .cmp{padding:5px 7px;width:132px}
#legend .full{padding:7px 9px;width:210px;font-size:11px;display:none}
#legend.x .cmp{display:none}
#legend.x .full{display:block}
.lg{margin-bottom:5px}
.lg:last-child{margin-bottom:0}
.lg .t{color:var(--ink);font-weight:500;margin-bottom:2px}
.lg .g{height:7px;border-radius:3px}
.lg .k{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;margin-top:1px}
.lg .sws{display:flex;flex-wrap:wrap;gap:3px 9px}
.lg .sws i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:3px;vertical-align:-1px}
.cmp .sws{gap:2px}
.cmp .sws i{width:22px;height:7px;margin:0}
.me{width:16px;height:16px;border-radius:50%;background:#2f8cff;border:3px solid #fff;box-shadow:0 0 0 2px rgba(47,140,255,.35)}
/* forecast sheet */
#sheet{position:absolute;z-index:1095;left:0;right:0;bottom:0;height:var(--sh);background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;display:flex;flex-direction:column;transition:height .25s ease;box-shadow:0 -6px 24px rgba(0,0,0,.3)}
#app.open{--sh:62%}
#shead{flex:none;padding:8px 14px 10px;border:0;background:none;text-align:left;width:100%;display:block}
#shead::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 8px}
.sum{display:flex;align-items:center;gap:12px}
.sum .ic{width:44px;height:44px;flex:none}
.big{font:600 46px/1 var(--display);font-variant-numeric:tabular-nums}
.sum .txt{flex:1;min-width:0}
.place{font:600 20px/1.1 var(--display);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cond{color:var(--mut);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status{font-size:12px;color:var(--mut);margin-top:6px}
#status.err{color:var(--bad)}
#tabs{flex:none;display:flex;gap:4px;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto}
#tabs button{border:0;background:none;padding:8px 10px;color:var(--mut);font:600 15px var(--display);letter-spacing:.04em;text-transform:uppercase;border-bottom:3px solid transparent;white-space:nowrap}
#tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
#tabs .badge{background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;font-size:12px;margin-left:4px}
#body{flex:1;overflow-y:auto;padding:12px 14px calc(20px + var(--sb));-webkit-overflow-scrolling:touch}
#saved{display:flex;gap:6px;overflow-x:auto;padding:0 14px 8px;flex:none}
#saved:empty{display:none}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:16px;padding:4px 11px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--onacc)}
h3{font:600 14px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:16px 0 8px}
h3:first-child{margin-top:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:66px}
.tile .l{font-size:12px;color:var(--mut)}
.tile .v{font:600 24px/1.15 var(--display);font-variant-numeric:tabular-nums}
.tile .v small{font:500 13px var(--body);color:var(--mut);margin-left:2px}
.tile .s{font-size:12px;color:var(--mut)}
.arrow{display:inline-block;width:14px;height:14px;vertical-align:-1px}
/* hourly strips */
#cursorinfo{font:600 15px var(--display);letter-spacing:.03em;margin-bottom:6px;color:var(--mut)}
.strip{position:relative;border:1px solid var(--line);background:var(--panel2);border-radius:10px;margin-bottom:8px;overflow:hidden;touch-action:pan-y}
.strip .hd{display:flex;justify-content:space-between;padding:6px 10px 0;font-size:12px;color:var(--mut)}
.strip .hd b{color:var(--ink);font:600 16px var(--display);font-variant-numeric:tabular-nums}
.strip svg{display:block;width:100%}
.strip text{font:10px var(--body);fill:var(--mut)}
.gl{stroke:var(--line);stroke-width:1}
.cur{stroke:var(--ink);stroke-width:1;opacity:.6}
/* daily */
.day{display:grid;grid-template-columns:52px 30px 44px 34px 1fr 34px;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.day .d{font:600 16px var(--display);letter-spacing:.03em}
.day .ic{width:26px;height:26px}
.day .p{color:var(--wet);font-size:13px}
.day .lo{color:var(--mut);text-align:right}
.day .hi{font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--line);position:relative}
.bar i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--cold),var(--accent),var(--hot))}
.day .x{grid-column:1/-1;font-size:12px;color:var(--mut);margin-top:-2px}
/* air + alerts */
.aqi{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.pill{display:inline-block;border-radius:12px;padding:2px 10px;font-weight:600;font-size:13px;color:#10151f}
.alert{border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--panel2)}
.alert.sev{border-left-color:var(--bad)}
.alert b{font:600 18px var(--display)}
.alert p{margin:6px 0 0;font-size:13px;white-space:pre-wrap;max-width:65ch}
.alert small{color:var(--mut)}
.note{color:var(--mut);font-size:13px;max-width:60ch}
.src a{color:var(--ink)}
.src li{margin-bottom:4px;font-size:13px;color:var(--mut)}
/* grid markers */
.gp{pointer-events:none}
.gv{display:inline-flex;align-items:center;gap:3px;transform:translate(-50%,-50%);position:absolute;left:50%;top:50%;padding:1px 6px;border-radius:9px;font:600 13px var(--display);color:#10151f;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.5);font-variant-numeric:tabular-nums}
.gv svg{width:14px;height:14px}
.pin{width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.45)}
/* settings drawer */
#drawer{position:absolute;z-index:1200;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--panel);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.35)}
#drawer.show{transform:none}
#drawer header{padding-top:calc(12px + var(--st))!important;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
#drawer header h2{margin:0;font:600 24px var(--display);letter-spacing:.02em}
#dbody{overflow-y:auto;padding:4px 14px 30px}
details{border-bottom:1px solid var(--line)}
summary{padding:12px 0;font:600 17px var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;flex-wrap:wrap}
.row>label,.row>span.lb{font-size:14px}
.row.col{flex-direction:column;align-items:stretch}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel2);padding:5px 10px;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--onacc);font-weight:600}
select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
textarea{width:100%;height:90px;font:12px ui-monospace,monospace}
input[type=range]{accent-color:var(--accent);width:150px}
input[type=checkbox]{accent-color:var(--accent);width:20px;height:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--panel2);border-radius:16px;padding:4px 10px;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--onacc);font-weight:600}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:7px 12px;font-weight:500}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}
.sw[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
#fatal{position:absolute;inset:0;z-index:2000;display:none;place-items:center;padding:24px;background:var(--bg);text-align:center}

@media (min-width:900px){
  :root{--sh:0px}
  #app.open{--sh:0px}
  #top{left:426px}
  #sheet{left:10px;top:10px;bottom:10px;right:auto;width:404px;height:auto;border:1px solid var(--line);border-radius:14px;transition:none}
  #shead{cursor:default}
  #shead::before{display:none}
  #timeline{left:426px;right:auto;width:440px;bottom:30px}
  #legend{left:426px;bottom:92px}
  #fab{bottom:40px}
}
@media (max-width:899px){#app.open #legend .full{display:none}#app.open #legend .cmp{display:block}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="map" aria-label="Weather map"></div>

  <div id="top">
    <div class="search">
      <input id="q" type="search" placeholder="Search a place or lat, lon" autocomplete="off" aria-label="Search a place">
      <div id="results"></div>
    </div>
    <button class="ib" id="opendrawer" aria-label="Customize"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Customize</span></button>
  </div>

  <button id="legend" aria-label="Map legend. Tap for details"></button>
  <button id="fab" title="Go to my current location" aria-label="Go to my current location"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 3L3 10.6l7.6 2.8L13.4 21z"/></svg></button>
  <div id="timeline">
    <button id="play" aria-label="Play radar loop"><svg width="14" height="14" viewBox="0 0 14 14"><path id="playic" d="M3 1l10 6-10 6z" fill="currentColor"/></svg></button>
    <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Radar frame">
    <div><div id="ftime">–</div><div id="fsrc"></div></div>
  </div>

  <section id="sheet" aria-label="Forecast">
    <button id="shead" aria-label="Show or hide forecast details">
      <div class="sum">
        <div class="ic" id="sic"></div>
        <div class="big" id="stemp">–</div>
        <div class="txt"><div class="place" id="splace">Loading</div><div class="cond" id="scond"></div></div>
      </div>
      <div id="status">Loading forecast</div>
    </button>
    <div id="saved"></div>
    <div id="tabs" role="tablist"></div>
    <div id="body"></div>
  </section>

  <aside id="drawer" aria-label="Customize">
    <header><h2>Customize</h2><button class="btn" id="closedrawer">Done</button></header>
    <div id="dbody"></div>
  </aside>
  <div id="fatal"><div><h2>The map library didn't load</h2><p class="note">Weatherville needs an internet connection to load Leaflet and the data feeds. Reconnect and reload this page.</p></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
'use strict';
if(!window.L){document.getElementById('fatal').style.display='grid';return}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- settings ---------- */
const tz=(Intl.DateTimeFormat().resolvedOptions().timeZone)||'';
const usTz=/^(America\/(New_York|Chicago|Denver|Los_Angeles|Phoenix|Detroit|Boise|Indiana|Kentucky|North_Dakota|Menominee))/.test(tz);
const DEF={
  uTemp:usTz?'F':'C',uWind:usTz?'mph':'kmh',uPrecip:usTz?'in':'mm',uPress:usTz?'inHg':'hPa',uDist:usTz?'mi':'km',clock:usTz?'12':'24',
  base:'dark',labelsTop:true,tapMove:true,legend:true,lgx:false,
  radar:true,radarSrc:usTz?'iem':'rv',radarOp:75,frames:7,speed:500,rvSmooth:true,
  sat:false,satProd:'geo-e',satOp:85,
  alertsMap:false,
  grid:false,gridVar:'wind',gridDen:'m',
  model:'best_match',hours:48,days:10,
  tiles:['feels','wind','gust','hum','dew','press','cloud','vis','uv','precip','sun'],
  strips:['temp','pop','precip','wind'],
  aqi:usTz?'us':'eu',theme:'dark',accent:'#f2a83b',refresh:10,
  loc:{name:'Chicago',sub:'Illinois, US',lat:41.8781,lon:-87.6298},saved:[]
};
let S=JSON.parse(JSON.stringify(DEF));
try{const s=JSON.parse(localStorage.getItem('weatherville.v1')||'null');if(s&&typeof s==='object')Object.assign(S,s)}catch(e){}
const save=()=>{try{localStorage.setItem('weatherville.v1',JSON.stringify(S))}catch(e){}};

/* ---------- units ---------- */
const fT=c=>c==null?null:(S.uTemp==='F'?c*9/5+32:c);
const WK={mph:.621371,kmh:1,kt:.539957,ms:1/3.6},WL={mph:'mph',kmh:'km/h',kt:'kt',ms:'m/s'};
const fW=k=>k==null?null:k*WK[S.uWind];
const fP=m=>m==null?null:(S.uPrecip==='in'?m/25.4:m);
const fPr=h=>h==null?null:(S.uPress==='inHg'?h*.02953:h);
const fD=m=>m==null?null:(S.uDist==='mi'?m/1609.34:m/1000);
const r=(v,d=0)=>(v==null||isNaN(v))?'–':Number(v).toFixed(d);
const pd=()=>S.uPrecip==='in'?2:1;
const card=d=>d==null?'':['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(d/22.5)%16];
const hh=t=>{const h=+t.slice(11,13);return S.clock==='24'?String(h).padStart(2,'0'):((h%12||12)+(h<12?'a':'p'))};
const tm=t=>{if(!t)return '–';const h=+t.slice(11,13),m=t.slice(14,16);return S.clock==='24'?`${String(h).padStart(2,'0')}:${m}`:`${h%12||12}:${m} ${h<12?'AM':'PM'}`};
const clockNow=ms=>new Date(ms).toLocaleTimeString([],{hour:'numeric',minute:'2-digit',hour12:S.clock==='12'});
const dayName=d=>new Date(d+'T12:00').toLocaleDateString([],{weekday:'short'});
const arrow=deg=>`<svg class="arrow" viewBox="0 0 14 14" style="transform:rotate(${(deg||0)+180}deg)"><path d="M7 1l4 11-4-3-4 3z" fill="currentColor"/></svg>`;

/* ---------- weather codes + icons ---------- */
const WMO={0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Freezing fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',56:'Freezing drizzle',57:'Freezing drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',80:'Light showers',81:'Showers',82:'Heavy showers',85:'Snow showers',86:'Heavy snow showers',95:'Thunderstorm',96:'Thunderstorm, hail',99:'Thunderstorm, heavy hail'};
function icon(code,day){
  const cl='<path d="M9 22h14a5 5 0 0 0 .6-10 7 7 0 0 0-13.4-1.6A6 6 0 0 0 9 22z"/>';
  const sun='<g stroke="var(--accent)"><circle cx="16" cy="16" r="5.5"/><path d="M16 4v3M16 25v3M4 16h3M25 16h3M7.5 7.5l2 2M22.5 22.5l2 2M7.5 24.5l2-2M22.5 9.5l2-2"/></g>';
  const moon='<path stroke="var(--accent)" d="M22 19.5A9 9 0 0 1 12.5 8 9 9 0 1 0 22 19.5z"/>';
  const up=s=>`<g transform="translate(0,-4)">${s}</g>`;
  let g;
  if(code<=1)g=day===0?moon:sun;
  else if(code===2)g=`<g transform="translate(-5,-5) scale(.7)">${day===0?moon:sun}</g><g transform="translate(3,4) scale(.85)">${cl}</g>`;
  else if(code===3)g=cl;
  else if(code<=48)g='<path d="M5 11h22M5 16h22M5 21h22"/>';
  else if(code>=95)g=up(cl)+'<path stroke="var(--accent)" fill="var(--accent)" d="M17 19l-4 6h3l-1 5 4-6h-3z"/>';
  else if((code>=71&&code<=77)||code>=85)g=up(cl)+'<g fill="currentColor" stroke="none"><circle cx="11" cy="24" r="1.4"/><circle cx="16" cy="27" r="1.4"/><circle cx="21" cy="24" r="1.4"/></g>';
  else g=up(cl)+'<path stroke="var(--wet)" d="M11 22l-2 5M16 22l-2 5M21 22l-2 5"/>';
  return `<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="100%" height="100%">${g}</svg>`;
}

/* ---------- fetch ---------- */
async function getJSON(url,ms=15000){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{const res=await fetch(url,{signal:c.signal,headers:{Accept:'application/geo+json, application/json'}});if(!res.ok)throw new Error('HTTP '+res.status);return await res.json()}
  finally{clearTimeout(t)}
}

let frames=[],fi=0,fLayers=[],playing=false,ptimer=null;
const RVA='Radar <a href="https://www.rainviewer.com/">RainViewer</a>',IEMA='NEXRAD via <a href="https://mesonet.agron.iastate.edu/">Iowa Environmental Mesonet</a>';
function clearRadar(){fLayers.forEach(l=>l&&map.removeLayer(l));fLayers=[]}
async function loadFrames(){
  clearRadar();frames=[];
  $('timeline').style.display=S.radar?'flex':'none';
  if(!S.radar){stop();return}
  try{
    if(S.radarSrc==='rv'){
      const j=await getJSON('https://api.rainviewer.com/public/weather-maps.json');
      frames=j.radar.past.slice(-S.frames).map(f=>({t:f.time*1000,u:`${j.host}${f.path}/256/{z}/{x}/{y}/2/${S.rvSmooth?1:0}_1.png`,nz:7,a:RVA}));
      $('fsrc').textContent='RainViewer, global';
    }else{
      const now=Math.floor(Date.now()/3e5)*3e5,n=Math.min(S.frames,11);
      for(let i=n-1;i>=0;i--){const m=i*5,id='nexrad-n0q-900913'+(m?'-m'+String(m).padStart(2,'0')+'m':'');
        frames.push({t:now-m*6e4,u:`https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/${id}/{z}/{x}/{y}.png?_=${now}`,nz:11,a:IEMA})}
      $('fsrc').textContent='NEXRAD, United States';
    }
  }catch(e){$('fsrc').textContent='Radar feed unreachable';$('ftime').textContent='–';return}
  $('scrub').max=frames.length-1;fi=frames.length-1;showFrame(fi);
  if(playing)frames.forEach((_,i)=>ensure(i));
}
function ensure(i){
  if(!fLayers[i]){const f=frames[i];fLayers[i]=L.tileLayer(f.u,{pane:'wx',opacity:0,maxNativeZoom:f.nz,maxZoom:19,attribution:f.a,keepBuffer:1}).addTo(map)}
  return fLayers[i];
}
function showFrame(i){
  if(!frames.length)return;
  fLayers.forEach((l,k)=>{if(l&&k!==i)l.setOpacity(0)});
  ensure(i).setOpacity(S.radarOp/100);fi=i;
  $('scrub').value=i;$('ftime').textContent=clockNow(frames[i].t);
}
function stop(){playing=false;clearInterval(ptimer);$('playic').setAttribute('d','M3 1l10 6-10 6z');$('play').setAttribute('aria-label','Play radar loop')}
function play(){
  if(!frames.length)return;playing=true;frames.forEach((_,i)=>ensure(i));
  $('playic').setAttribute('d','M2 1h4v12H2zM8 1h4v12H8z');$('play').setAttribute('aria-label','Pause radar loop');
  clearInterval(ptimer);let hold=0;
  ptimer=setInterval(()=>{if(fi===frames.length-1&&hold<2){hold++;return}hold=0;showFrame((fi+1)%frames.length)},S.speed);
}
$('play').onclick=()=>playing?stop():play();
$('scrub').oninput=e=>{stop();showFrame(+e.target.value)};

/* sampled data grid (Open-Meteo, any model) */
const GV={
  wind:{n:'Wind',q:'wind_speed_10m,wind_direction_10m'},gust:{n:'Gusts',q:'wind_gusts_10m'},
  temp:{n:'Temperature',q:'temperature_2m'},feels:{n:'Feels like',q:'apparent_temperature'},dew:{n:'Dew point',q:'dew_point_2m'},
  hum:{n:'Humidity',q:'relative_humidity_2m'},press:{n:'Pressure',q:'pressure_msl'},cloud:{n:'Cloud cover',q:'cloud_cover'},precip:{n:'Precipitation',q:'precipitation'}
};
const tcol=c=>`hsl(${Math.max(0,Math.min(270,270-(c+25)*4.2))} 85% 62%)`;
const wcol=k=>`hsl(${Math.max(0,170-k*2.4)} 80% 62%)`;
const pcol=p=>`hsl(200 80% ${Math.max(45,90-p*.45)}%)`;
const gridL=L.layerGroup().addTo(map);let gtimer=null,gseq=0;
function queueGrid(){clearTimeout(gtimer);gtimer=setTimeout(loadGrid,700)}
async function loadGrid(){
  if(!S.grid){gridL.clearLayers();return}
  const b=map.getBounds(),[nx,ny]={s:[4,4],m:[6,5],l:[8,7]}[S.gridDen]||[6,5],pts=[];
  const s=Math.max(-85,b.getSouth()),n=Math.min(85,b.getNorth()),w=b.getWest(),e=b.getEast();
  for(let y=0;y<ny;y++)for(let x=0;x<nx;x++){const la=s+(n-s)*(y+.5)/ny,lo=w+(e-w)*(x+.5)/nx;pts.push([la,lo])}
  const v=GV[S.gridVar]||GV.wind,seq=++gseq;
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${pts.map(p=>p[0].toFixed(3))}&longitude=${pts.map(p=>(((p[1]+540)%360+360)%360-180).toFixed(3))}&current=${v.q}${S.model!=='best_match'?'&models='+S.model:''}`;
  let j;try{j=await getJSON(url)}catch(err){return}
  if(seq!==gseq)return;
  gridL.clearLayers();
  (Array.isArray(j)?j:[j]).forEach((o,i)=>{
    const c=o.current||{};let html,bg;
    switch(S.gridVar){
      case 'wind':bg=wcol(c.wind_speed_10m);html=arrow(c.wind_direction_10m)+r(fW(c.wind_speed_10m));break;
      case 'gust':bg=wcol(c.wind_gusts_10m);html=r(fW(c.wind_gusts_10m));break;
      case 'temp':bg=tcol(c.temperature_2m);html=r(fT(c.temperature_2m))+'°';break;
      case 'feels':bg=tcol(c.apparent_temperature);html=r(fT(c.apparent_temperature))+'°';break;
      case 'dew':bg=tcol(c.dew_point_2m);html=r(fT(c.dew_point_2m))+'°';break;
      case 'hum':bg=pcol(c.relative_humidity_2m);html=r(c.relative_humidity_2m)+'%';break;
      case 'cloud':bg=`hsl(215 15% ${95-c.cloud_cover*.4}%)`;html=r(c.cloud_cover)+'%';break;
      case 'press':bg='#cfd6e2';html=r(fPr(c.pressure_msl),S.uPress==='inHg'?2:0);break;
      default:bg=pcol(Math.min(100,c.precipitation*25));html=r(fP(c.precipitation),pd());
    }
    L.marker(pts[i],{interactive:false,icon:L.divIcon({className:'gp',html:`<span class="gv" style="background:${bg}">${html}</span>`,iconSize:[0,0]})}).addTo(gridL);
  });
}

/* ---------- legend ---------- */
function grad(fn,lo,hi,n=9){const a=[];for(let i=0;i<n;i++)a.push(fn(lo+(hi-lo)*i/(n-1)));return 'linear-gradient(90deg,'+a.join(',')+')'}
function renderLegend(){
  const el=$('legend');if(!S.legend){el.innerHTML='';return}
  const F=[],C=[],bar=(t,g,ks)=>`<div class="lg">${t?`<div class="t">${t}</div>`:''}<div class="g" style="background:${g}"></div><div class="k">${ks.map(k=>`<span>${k}</span>`).join('')}</div></div>`;
  const add=(t,g,ks,cks)=>{F.push(bar(t,g,ks));C.push(bar('',g,cks||ks))};
  if(S.radar){
    if(S.radarSrc==='iem'){add('Radar reflectivity, dBZ','linear-gradient(90deg,#04e9e7,#019ff4,#0300f4,#02fd02,#01c501,#008e00,#fdf802,#e5bc00,#fd9500,#fd0000,#d40000,#bc0000,#f800fd,#9854c6,#fdfdfd)',[5,20,35,50,65,75],['Light','Heavy','Hail']);
      F.push('<div class="lg"><div class="k"><span>Light</span><span>Moderate</span><span>Heavy</span><span>Hail</span></div></div>')}
    else add('Radar, rain intensity','linear-gradient(90deg,#9be1f0,#33aadd,#0a5fa8,#ffe600,#ffa000,#ff3c00,#b80000,#ff8cf5)',['Light','Moderate','Heavy','Extreme'],['Light','Heavy','Extreme']);
  }
  if(S.grid){
    const T=c=>r(fT(c))+'°',W=k=>r(fW(k)),v=S.gridVar,n=(GV[v]||GV.wind).n;
    if(v==='temp'||v==='feels'||v==='dew')add(`${n}, °${S.uTemp}`,grad(tcol,-25,39),[T(-25),T(-9),T(7),T(23),T(39)],[T(-25),T(7),T(39)]);
    else if(v==='wind'||v==='gust')add(`${n}, ${WL[S.uWind]}`+(v==='wind'?' (arrow points downwind)':''),grad(wcol,0,70),[W(0),W(23),W(47),W(70)+'+'],[W(0),W(35)+' '+WL[S.uWind],W(70)+'+']);
    else if(v==='hum')add('Humidity',grad(pcol,0,100),['0%','50%','100%']);
    else if(v==='cloud')add('Cloud cover',grad(c=>`hsl(215 15% ${95-c*.4}%)`,0,100),['0%','50%','100%'],['Clear','Cloudy']);
    else if(v==='precip')add(`Precipitation, ${S.uPrecip} per hour`,grad(pcol,0,100),[r(fP(0),pd()),r(fP(2),pd()),r(fP(4),pd())+'+'],[r(fP(0),pd()),r(fP(4),pd())+'+ '+S.uPrecip]);
    else F.push(`<div class="lg"><div class="t">Sea-level pressure, ${S.uPress}</div></div>`);
  }
  if(S.alertsMap){const sw=['#f2d24e','#ffa23e','#ff4b3e','#d63fd0'],nm=['Minor','Moderate','Severe','Extreme'];
    F.push(`<div class="lg"><div class="t">US warnings by severity</div><div class="sws">${sw.map((c,i)=>`<span><i style="background:${c}"></i>${nm[i]}</span>`).join('')}</div></div>`);
    C.push(`<div class="lg"><div class="sws">${sw.map(c=>`<i style="background:${c}"></i>`).join('')}</div><div class="k"><span>Minor</span><span>Extreme</span></div></div>`)}
  if(S.sat)F.push(`<div class="lg"><div class="t">Satellite: ${({'geo-e':'GOES-East GeoColor','geo-w':'GOES-West GeoColor','ir-e':'GOES-East infrared (brighter is colder, higher cloud)','true':'VIIRS true color, yesterday'})[S.satProd]||''}</div></div>`);
  F.push('<div class="lg"><div class="sws"><span><i style="background:var(--accent);border-radius:50%"></i>Forecast point</span><span><i style="background:#2f8cff;border-radius:50%"></i>You</span></div></div><div class="lg">Tap to shrink</div>');
  if(!C.length){el.innerHTML='';return}
  el.className=S.lgx?'x':'';el.setAttribute('aria-expanded',!!S.lgx);
  el.innerHTML=`<div class="cmp">${C.join('')}</div><div class="full">${F.join('')}</div>`;
}

let qt=null;
$('q').addEventListener('input',e=>{clearTimeout(qt);const v=e.target.value.trim();if(v.length<2){$('results').style.display='none';return}qt=setTimeout(()=>search(v),300)});
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){const b=$('results').querySelector('button');if(b)b.click()}});
async function search(v){
  const box=$('results');let list=[];
  const m=v.match(/^\s*(-?\d+(\.\d+)?)\s*,\s*(-?\d+(\.\d+)?)\s*$/);
  if(m&&Math.abs(+m[1])<=90&&Math.abs(+m[3])<=180)list=[{lat:+m[1],lon:+m[3],name:`${(+m[1]).toFixed(2)}, ${(+m[3]).toFixed(2)}`,sub:'Coordinates',rev:true}];
  else try{const j=await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(v)}&count=6&language=en&format=json`);
    list=(j.results||[]).map(x=>({lat:x.latitude,lon:x.longitude,name:x.name,sub:[x.admin1,x.country_code].filter(Boolean).join(', ')}))}
  catch(e){box.innerHTML='<button disabled>Search is unreachable. Check your connection.</button>';box.style.display='block';return}
  box.innerHTML=list.length?list.map((x,i)=>`<button data-i="${i}">${esc(x.name)} <small>${esc(x.sub)}</small></button>`).join(''):'<button disabled>No places found</button>';
  box.style.display='block';
  box.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>{const x=list[+b.dataset.i];box.style.display='none';$('q').value='';$('q').blur();setLoc(x,true,x.rev)});
}
let meDot=null,meRing=null;
$('fab').onclick=()=>{
  if(!navigator.geolocation){status('This browser has no location access. Search for a place instead.',true);return}
  const f=$('fab');f.classList.add('busy');status('Finding your location');
  navigator.geolocation.getCurrentPosition(p=>{
    f.classList.remove('busy');f.classList.add('on');
    const ll=[p.coords.latitude,p.coords.longitude];
    if(meDot){map.removeLayer(meDot);map.removeLayer(meRing)}
    meRing=L.circle(ll,{radius:Math.min(p.coords.accuracy||0,5000),color:'#2f8cff',weight:1,fillOpacity:.12,interactive:false}).addTo(map);
    meDot=L.marker(ll,{interactive:false,zIndexOffset:900,icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[16,16],iconAnchor:[11,11]})}).addTo(map);
    setLoc({lat:ll[0],lon:ll[1]},true,true);
  },e=>{f.classList.remove('busy');status(e.code===1?'Location is blocked for this site. Allow it in your browser settings, or search for a place.':"Couldn't get a location fix. Try again, or search for a place.",true)},
  {enableHighAccuracy:true,timeout:12000,maximumAge:60000});
};
function isSaved(){return S.saved.findIndex(x=>x.lat===S.loc.lat&&x.lon===S.loc.lon)}

  $('star').onclick=()=>{const i=isSaved();i>=0?S.saved.splice(i,1):S.saved.push({...S.loc});save();renderSaved()};

let pseq=0;
async function loadPoint(){
  const {lat,lon}=S.loc,seq=++pseq;status('Loading forecast');
  $('splace').textContent=S.loc.name;
  const mdl=S.model!=='best_match'?'&models='+S.model:'';
  const f=getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=${CUR}&hourly=${HR}&daily=${DY}&timezone=auto&forecast_days=${S.days}${mdl}`);
  const a=getJSON(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=us_aqi,european_aqi,pm2_5,pm10,ozone,nitrogen_dioxide,sulphur_dioxide,carbon_monoxide&timezone=auto`).catch(()=>null);
  alertsUS=lat>13&&lat<72&&lon>-180&&lon<-64;
  const al=alertsUS?getJSON(`https://api.weather.gov/alerts/active?point=${lat},${lon}`).catch(()=>null):Promise.resolve(null);
  try{
    const [d,aq,alr]=await Promise.all([f,a,al]);if(seq!==pseq)return;
    D=d;AQ=aq;AL=alr&&alr.features?alr.features:(alertsUS?null:[]);
    status(`Updated ${clockNow(Date.now())} · ${MODELS[S.model]||'Open-Meteo'} · ${S.loc.sub||`${lat}, ${lon}`}`);
    render();
  }catch(e){if(seq===pseq)status("Couldn't reach Open-Meteo. Check your connection, then pick the place again.",true)}
}

function render(){
  renderTabs();if(!D){return}
  const c=D.current;
  $('sic').innerHTML=icon(c.weather_code,c.is_day);
  $('stemp').textContent=r(fT(c.temperature_2m))+'°';
  $('splace').textContent=S.loc.name;
  $('scond').textContent=`${WMO[c.weather_code]||''} · feels ${r(fT(c.apparent_temperature))}° · H ${r(fT(D.daily.temperature_2m_max[0]))}° L ${r(fT(D.daily.temperature_2m_min[0]))}°`;
  const B=$('body');
  if(tab==='now')B.innerHTML=nowHTML();
  else if(tab==='hourly'){B.innerHTML='<div id="cursorinfo">Drag across a chart to read any hour</div><div id="strips"></div>';drawStrips()}
  else if(tab==='daily')B.innerHTML=dailyHTML();
  else if(tab==='air')B.innerHTML=airHTML();
  else if(tab==='alerts')B.innerHTML=alertsHTML();

function nowHTML(){
  const t=S.tiles.filter(k=>TILE[k]).map(k=>{const [l,fn]=TILE[k],[v,u,s]=fn();return `<div class="tile"><div class="l">${l}</div><div class="v">${v}${u?`<small>${u}</small>`:''}</div>${s?`<div class="s">${s}</div>`:''}</div>`}).join('');
  const s=i0(),h=D.hourly;let next='';
  for(let i=s;i<s+12&&i<h.time.length;i++)next+=`<div class="tile" style="min-width:62px;text-align:center;flex:none"><div class="l">${i===s?'Now':hh(h.time[i])}</div><div style="width:26px;height:26px;margin:2px auto">${icon(h.weather_code[i],h.is_day[i])}</div><div class="v" style="font-size:20px">${r(fT(h.temperature_2m[i]))}°</div><div class="s" style="color:var(--wet)">${h.precipitation_probability[i]==null?'':r(h.precipitation_probability[i])+'%'}</div></div>`;
  return `<h3>Next 12 hours</h3><div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px">${next}</div><h3>Conditions</h3><div class="tiles">${t||'<p class="note">No condition tiles are switched on. Pick some under Customize, Forecast.</p>'}</div>`;

let HX=null;
function drawStrips(){
  const box=$('strips');if(!box)return;const h=D.hourly,s=i0(),n=Math.min(S.hours,h.time.length-s);
  const W=Math.max(260,box.clientWidth-2),Hh=58,times=h.time.slice(s,s+n);
  const step=n>120?24:n>72?12:6;HX={times,vals:{},W,n};
  box.innerHTML=S.strips.filter(k=>SER[k]).map(k=>{
    const se=SER[k],d=se.d?se.d():0,vals=h[se.k].slice(s,s+n).map(v=>v==null?null:se.f(v));HX.vals[k]=vals;
    const ok=vals.filter(v=>v!=null);if(!ok.length)return `<div class="strip"><div class="hd"><span>${se.n}</span><span>Not provided by this model</span></div></div>`;
    let lo=se.min!=null?se.min:Math.min(...ok),hi=se.max!=null?se.max:Math.max(...ok);if(hi-lo<1e-9)hi=lo+1;
    const x=i=>i/(n-1)*W,y=v=>4+(1-(v-lo)/(hi-lo))*(Hh-8);
    let g='',ax='';
    times.forEach((t,i)=>{const hr=+t.slice(11,13);if(hr===0)g+=`<line class="gl" x1="${x(i)}" x2="${x(i)}" y1="0" y2="${Hh}"/>`;
      if(hr%step===0&&x(i)>8&&x(i)<W-16)ax+=`<text x="${x(i)}" y="${Hh+11}" text-anchor="middle">${hr===0?dayName(t.slice(0,10)):hh(t)}</text>`});
    let mark;
    if(se.bar){const bw=Math.max(1,W/n-1);mark=vals.map((v,i)=>v?`<rect x="${x(i)-bw/2}" y="${y(v)}" width="${bw}" height="${Hh-4-y(v)}" fill="${se.c}" opacity=".8"/>`:'').join('')}
    else{let p='',pen=false,first=null,last=null;vals.forEach((v,i)=>{if(v==null){pen=false;return}p+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1);pen=true;if(first==null)first=i;last=i});
      mark=`<path d="${p}L${x(last)} ${Hh}L${x(first)} ${Hh}Z" fill="${se.c}" opacity=".14"/><path d="${p}" fill="none" stroke="${se.c}" stroke-width="2" stroke-linejoin="round"/>`}
    return `<div class="strip" data-k="${k}"><div class="hd"><span>${se.n} <b class="rv">${r(vals[0],d)}${se.u()}</b></span><span>${r(Math.min(...ok),d)} to ${r(Math.max(...ok),d)}${se.u()}</span></div><svg viewBox="0 0 ${W} ${Hh+15}" height="${Hh+15}">${g}${mark}${ax}<line class="cur" x1="0" x2="0" y1="0" y2="${Hh}"/></svg></div>`;
  }).join('')||'<p class="note">No hourly charts are switched on. Pick some under Customize, Forecast.</p>';
  const move=e=>{const st=e.target.closest('.strip');if(!st||!HX)return;const svg=st.querySelector('svg');if(!svg)return;const rc=svg.getBoundingClientRect();
    const i=Math.max(0,Math.min(HX.n-1,Math.round((e.clientX-rc.left)/rc.width*(HX.n-1))));
    box.querySelectorAll('.strip').forEach(el=>{const k=el.dataset.k,se=SER[k];if(!se||!HX.vals[k])return;
      const c=el.querySelector('.cur');if(c){c.setAttribute('x1',i/(HX.n-1)*HX.W);c.setAttribute('x2',i/(HX.n-1)*HX.W)}
      el.querySelector('.rv').textContent=r(HX.vals[k][i],se.d?se.d():0)+se.u()});
    const t=HX.times[i];$('cursorinfo').textContent=`${dayName(t.slice(0,10))} ${tm(t)}`};
  box.onpointermove=move;box.onpointerdown=move;
}
function dailyHTML(){
  const d=D.daily,lo=Math.min(...d.temperature_2m_min.filter(v=>v!=null)),hi=Math.max(...d.temperature_2m_max.filter(v=>v!=null)),sp=(hi-lo)||1;
  return d.time.map((t,i)=>{const a=d.temperature_2m_min[i],b=d.temperature_2m_max[i];
    return `<div class="day"><div class="d">${i===0?'Today':dayName(t)}</div><div class="ic">${icon(d.weather_code[i],1)}</div><div class="p">${d.precipitation_probability_max[i]==null?'':r(d.precipitation_probability_max[i])+'%'}</div><div class="lo">${r(fT(a))}°</div><div class="bar"><i style="left:${(a-lo)/sp*100}%;right:${(hi-b)/sp*100}%"></i></div><div class="hi">${r(fT(b))}°</div>
    <div class="x">${WMO[d.weather_code[i]]||''} · ${r(fP(d.precipitation_sum[i]),pd())} ${S.uPrecip} · wind ${card(d.wind_direction_10m_dominant[i])} ${r(fW(d.wind_speed_10m_max[i]))}, gusts ${r(fW(d.wind_gusts_10m_max[i]))} ${WL[S.uWind]} · UV ${r(d.uv_index_max[i])}</div></div>`}).join('');
}
function airHTML(){
  if(!AQ||!AQ.current)return '<p class="note">Air quality is unavailable for this place right now.</p>';
  const c=AQ.current,us=S.aqi==='us',v=us?c.us_aqi:c.european_aqi;
  const sc=us?[[50,'Good','--good'],[100,'Moderate','--warn'],[150,'Unhealthy for sensitive groups','--warn'],[200,'Unhealthy','--bad'],[300,'Very unhealthy','--bad'],[1e9,'Hazardous','--bad']]:[[20,'Good','--good'],[40,'Fair','--good'],[60,'Moderate','--warn'],[80,'Poor','--bad'],[100,'Very poor','--bad'],[1e9,'Extremely poor','--bad']];
  const k=sc.find(x=>v<=x[0])||sc[5];
  const P=[['PM2.5',c.pm2_5],['PM10',c.pm10],['Ozone',c.ozone],['NO₂',c.nitrogen_dioxide],['SO₂',c.sulphur_dioxide],['CO',c.carbon_monoxide]];
  return `<div class="aqi"><div class="big">${r(v)}</div><div><span class="pill" style="background:var(${k[2]})">${k[1]}</span><div class="note">${us?'US AQI':'European AQI'}, CAMS model via Open-Meteo</div></div></div><div class="tiles">${P.map(([n,x])=>`<div class="tile"><div class="l">${n}</div><div class="v">${r(x,x<10?1:0)}<small>µg/m³</small></div></div>`).join('')}</div>`;
}
function alertsHTML(){

  el.onclick=e=>{const b=e.target.closest('button[data-v]');if(!b)return;const g=b.parentElement;
    if(g.dataset.seg){const k=g.dataset.seg;S[k]=num(k,b.dataset.v);g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));save();apply(find(k).fx)}
    else if(g.dataset.multi){const k=g.dataset.multi,v=b.dataset.v,i=S[k].indexOf(v);i>=0?S[k].splice(i,1):S[k].push(v);
      S[k]=find(k).o.map(o=>o[0]).filter(o=>S[k].includes(o));b.setAttribute('aria-pressed',i<0);save();apply(find(k).fx)}};
  $('set-json').value=JSON.stringify(S);
  $('cp').onclick=async()=>{$('set-json').value=JSON.stringify(S);try{await navigator.clipboard.writeText($('set-json').value);$('bkmsg').textContent='Copied.'}catch(e){$('set-json').select();$('bkmsg').textContent='Select the text and copy it.'}};
  $('ap').onclick=()=>{try{const j=JSON.parse($('set-json').value);if(!j||typeof j!=='object'||!j.loc)throw 0;S=Object.assign(JSON.parse(JSON.stringify(DEF)),j);save();boot()}catch(e){$('bkmsg').textContent="That text isn't a Weatherville setup. Paste the full text you copied earlier."}};
  $('rs').onclick=()=>{S=JSON.parse(JSON.stringify(DEF));save();boot()};
}
function theme(){
  const t=S.theme==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):S.theme;
  document.documentElement.dataset.theme=t;document.documentElement.style.setProperty('--accent',S.accent);
}
let rtimer=null;
function setTimer(){clearInterval(rtimer);if(S.refresh>0)rtimer=setInterval(()=>{loadPoint();if(!playing)loadFrames();syncSat();syncAlertsMap();loadGrid()},S.refresh*6e4)}
function apply(fx){
  renderLegend();
  if(fx==='base')syncBase();
  else if(fx==='radar')loadFrames();
  else if(fx==='radarop')showFrame(fi);
  else if(fx==='speed'){if(playing)play()}
  else if(fx==='sat')syncSat();
  else if(fx==='alerts')syncAlertsMap();
  else if(fx==='grid')loadGrid();
  else if(fx==='fetch'){loadPoint();loadGrid()}
  else if(fx==='units'){render();loadGrid();if(frames.length)showFrame(fi)}
  else if(fx==='theme')theme();
  else if(fx==='timer')setTimer();
  else if(fx==='render')render();
}
$('opendrawer').onclick=()=>{$('set-json').value=JSON.stringify(S);$('drawer').classList.add('show')};
$('closedrawer').onclick=()=>$('drawer').classList.remove('show');
$('shead').onclick=()=>$('app').classList.toggle('open');
map.on('mousedown touchstart',()=>{$('results').style.display='none'});
let rz=null;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{map.invalidateSize();if(tab==='hourly'&&D)drawStrips()},200)});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',theme);

function boot(){
  stop();theme();buildDrawer();syncBase();syncSat();syncAlertsMap();
  pin.setLatLng([S.loc.lat,S.loc.lon]);map.setView([S.loc.lat,S.loc.lon],map.getZoom());
  renderSaved();renderTabs();renderLegend();loadFrames();loadPoint();loadGrid();setTimer();
}
boot();
})();
</script>
